name: Code checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install collector parser for tests
        run: python -m pip install "$(sed -n '/^beautifulsoup4==/p' requirements.txt)"
      - name: Install video tools when missing
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version >/dev/null
          ffprobe -version >/dev/null
      - name: Test without account credentials
        run: python -m unittest discover -s tests -v
