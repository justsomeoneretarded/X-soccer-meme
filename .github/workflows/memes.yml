name: Soccer memes
on:
  schedule:
    - cron: '7-59/10 * * * *'
  workflow_dispatch:
    inputs:
      live:
        description: 'Publish at most ONE meme (off = preview)'
        type: boolean
        default: false
      initialize:
        description: 'Create isolated posting history (first run only)'
        type: boolean
        default: false
      check_ai:
        description: 'Only test the AI keys/models (no collection, no posting)'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: soccer-meme-posting
  cancel-in-progress: false
jobs:
  memes:
    if: github.event_name == 'workflow_dispatch' || vars.AUTO_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser for preview
        if: inputs.check_ai || (github.event_name == 'workflow_dispatch' && !inputs.live)
        run: timeout 90s python -m pip install --timeout 15 --retries 2 "$(sed -n '/^beautifulsoup4==/p' requirements.txt)"
      - name: Install dependencies for publishing
        if: github.event_name == 'schedule' || (inputs.live && !inputs.check_ai)
        run: timeout 90s python -m pip install --timeout 15 --retries 2 -r requirements.txt
      - name: Prepare optional Reddit audio support
        if: github.event_name == 'schedule' || (inputs.live && !inputs.check_ai)
        continue-on-error: true
        run: |
          if python -c 'import json, sys; sys.exit(not json.load(open("sources.json"))["reddit"])' && ! command -v ffmpeg >/dev/null; then
            sudo timeout 60s apt-get -o Acquire::Retries=1 update
            sudo timeout 90s apt-get -o Acquire::Retries=1 install -y --no-install-recommends ffmpeg
          fi
      - name: Collect if due, then preview or post one meme
        env:
          TWEETKIT_COOKIE: ${{ (inputs.live || github.event_name == 'schedule') && secrets.TWEETKIT_COOKIE || '' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash' }}
          AI_PROVIDER_ORDER: ${{ vars.AI_PROVIDER_ORDER || 'gemini,groq' }}
          MIN_SCORE: ${{ vars.MIN_SCORE || '70' }}
          DAILY_LIMIT: ${{ vars.DAILY_LIMIT || '0' }}
          TRENDING_DB: ${{ github.workspace }}/.local/actions/memes.db
          LIVE: ${{ (inputs.live || github.event_name == 'schedule') }}
          INITIALIZE: ${{ inputs.initialize }}
          CHECK_AI: ${{ inputs.check_ai }}
        shell: bash
        run: |
          if [[ "$CHECK_AI" == "true" ]]; then exec python meme_worker.py --mode check-ai; fi
          args=(--mode auto)
          if [[ "$LIVE" == "true" ]]; then args+=(--live); fi
          if [[ "$INITIALIZE" == "true" ]]; then args+=(--initialize); fi
          python meme_worker.py "${args[@]}"
      - name: Save result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meme-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: posting-report.json
          if-no-files-found: ignore
          retention-days: 7
